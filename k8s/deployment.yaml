apiVersion: apps/v1
kind: Deployment
metadata:
  name: yokode-deployment
  labels:
    app: yokode
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yokode
  template:
    metadata:
      labels:
        app: yokode
    spec:
      containers:
        - name: yokode-app
          image: yokode-app:v1
          imagePullPolicy: IfNotPresent
          env:
          - name: APP_KEY
            value: "base64:q2t8Hk5B9C/T7+M5X7t5M5X7t5M5X7t5M5X7t5M5X7s="
          - name: APP_ENV
            value: "local"
          - name: APP_DEBUG
            value: "true"
          - name: DB_CONNECTION
            value: "mysql"
          - name: DB_HOST
            value: "mysql-service"
          - name: DB_PORT
            value: "3306"
          - name: DB_DATABASE
            value: "yokode_db"
          - name: DB_USERNAME
            value: "root"
          - name: DB_PASSWORD
            value: ""
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: yokode-service
spec:
  type: NodePort
  selector:
    app: yokode
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
