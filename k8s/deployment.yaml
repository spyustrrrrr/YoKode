apiVersion: apps/v1
kind: Deployment
metadata:
  name: yokode-deployment
  labels:
    app: yokode
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yokode
  template:
    metadata:
      labels:
        app: yokode
    spec:
      containers:
        - name: yokode-app
          image: yokode-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: yokode-service
spec:
  type: NodePort
  selector:
    app: yokode
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
